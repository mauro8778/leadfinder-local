# Blueprint de Render: web + Evolution + Postgres.
# En el dashboard: Blueprints → Sync (o New → Blueprint → este repo).
databases:
  - name: leadfinder-evo-db
    plan: basic-256mb
    postgresMajorVersion: "16"

services:
  - type: web
    name: leadfinder
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    disk:
      name: leadfinder-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /data
      - key: NODE_ENV
        value: production
      - key: EVOLUTION_URL
        fromService:
          name: leadfinder-evolution
          type: pserv
          property: hostport
      - key: EVOLUTION_API_KEY
        fromService:
          name: leadfinder-evolution
          type: pserv
          envVarKey: AUTHENTICATION_API_KEY
      - key: EVOLUTION_INSTANCE
        value: leadfinder

  - type: pserv
    name: leadfinder-evolution
    runtime: docker
    dockerfilePath: ./Dockerfile.evolution
    plan: starter
    disk:
      name: evolution-data
      mountPath: /evolution/instances
      sizeGB: 1
    envVars:
      - key: AUTHENTICATION_API_KEY
        generateValue: true
      - key: AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES
        value: "true"
      - key: DATABASE_PROVIDER
        value: postgresql
      - key: DATABASE_CONNECTION_URI
        fromDatabase:
          name: leadfinder-evo-db
          property: connectionString
      - key: CACHE_REDIS_ENABLED
        value: "false"
      - key: CACHE_LOCAL_ENABLED
        value: "true"
      - key: SERVER_URL
        fromService:
          name: leadfinder-evolution
          type: pserv
          property: hostport
      - key: DEL_INSTANCE
        value: "false"
